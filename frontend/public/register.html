<div class="auth-form">
    <img src="/img/camagru-co.png" alt="Camagru" class="auth-logo">
    <h2 class="auth-title">Get started</h2>
    <p class="auth-subtitle">Sign up to share and discover pictures.</p>
    <form id="register">
        <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input class="form-input" type="email" id="email" name="email" placeholder="Email">
        </div>
        <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input class="form-input" type="text" id="username" name="username" placeholder="Username">
        </div>
        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input class="form-input" type="password" id="password" name="password" placeholder="Password">
            <div id="password-strength" class="password-strength"></div>
        </div>
        <div class="form-group">
            <label class="form-label" for="passwordConfirm">Confirm password</label>
            <input class="form-input" type="password" id="passwordConfirm" name="passwordConfirm" placeholder="Confirm password">
        </div>
        <button class="btn btn-primary btn-block" type="submit">Sign up</button>
        <div id="message" class="message mt-2"></div>
    </form>
</div>
