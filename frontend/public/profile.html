<div class="align-items-center profile" style="max-width: 480px; margin: 2rem auto;">
    <form id="profile">
        <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input class="form-input" type="text" id="username" placeholder="Username">
        </div>
        <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input class="form-input" type="email" id="email" placeholder="Email">
        </div>
        <div class="form-group">
            <label class="form-label" for="password">New password (leave empty to keep current)</label>
            <input class="form-input" type="password" id="password" placeholder="New password">
        </div>
        <div class="empty-action">
            <button class="btn btn-primary" type="submit">Save changes</button>
            <div id="message" class="message mt-2"></div>
        </div>
    </form>
</div>
