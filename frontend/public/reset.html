<div class="auth-form">
    <h2 class="auth-title" data-i18n="reset.title">Choose a new password</h2>
    <p class="auth-subtitle" data-i18n="reset.subtitle">Pick a strong password you don't use elsewhere.</p>
    <form id="reset">
        <div class="form-group">
            <input class="form-input" type="password" id="password" placeholder="New password" required data-i18n-ph="reset.password" autocomplete="new-password" maxlength="500">
        </div>
        <button class="btn btn-primary btn-block" type="submit" data-i18n="reset.submit">Reset password</button>
        <div id="message" class="message mt-2"></div>
    </form>
</div>
