<div class="auth-split">
    <div class="auth-hero">
        <h1>Share your moments with Camagru.</h1>
        <p>Capture a picture, decorate it with fun overlays and post it to the gallery.</p>
    </div>
    <div class="auth-panel">
        <h2 class="auth-title">Log into Camagru</h2>
        <form id="login">
            <div class="form-group">
                <input class="form-input" type="text" id="username" placeholder="Username">
            </div>
            <div class="form-group">
                <input class="form-input" type="password" id="password" placeholder="Password">
            </div>
            <button class="btn btn-primary btn-block" type="submit">Log in</button>
            <div id="message" class="message mt-2"></div>
        </form>
        <a href="/forgot" onclick="navigate(event, 'forgot')" class="auth-link">Forgot password?</a>
        <a href="/register" onclick="navigate(event, 'register')" class="btn btn-block register-cta">Create new account</a>
    </div>
</div>
