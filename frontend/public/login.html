<div class="auth-split">
    <img src="/img/meme-images.png" alt="" class="login-bg">
    <div class="auth-hero">
        <img src="/img/camagru-co.png" alt="Camagru" class="hero-logo">
        <h1 data-i18n="login.heroTitle">Share your moments.</h1>
        <p data-i18n="login.heroText">Capture a picture, decorate it with fun overlays and post it to the gallery.</p>
    </div>
    <div class="auth-panel">
        <h2 class="auth-title" data-i18n="login.title">Login</h2>
        <form id="login">
            <div class="form-group">
                <input class="form-input" type="text" id="username" placeholder="Username" data-i18n-ph="login.username">
            </div>
            <div class="form-group">
                <input class="form-input" type="password" id="password" placeholder="Password" data-i18n-ph="login.password">
            </div>
            <button class="btn btn-primary btn-block" type="submit" data-i18n="login.submit">Log in</button>
            <div id="message" class="message mt-2"></div>
        </form>
        <a href="/forgot" onclick="navigate(event, 'forgot')" class="auth-link" data-i18n="login.forgot">Forgot password?</a>
        <a href="/register" onclick="navigate(event, 'register')" class="btn btn-block register-cta" data-i18n="login.createAccount">Create new account</a>
    </div>
</div>
<a href="/list" onclick="navigate(event, 'list')" class="auth-link" data-i18n="login.browse">See photos already shared</a>
