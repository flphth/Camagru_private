<div class="align-items-center login">
    <form id="login">
        <div class="empty">
            <div class="form-group">
                <div class="col-ml-auto">
                    <label class="form-label" for="username">Username</label>
                    <input class="form-input" type="text" id="username" placeholder="Username">
                </div>
            </div>
            <div class="form-group">
                <div class="col-ml-auto">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-input" type="password" id="password" placeholder="Password">
                </div>
            </div>
            <div class="empty-action">
                <button class="btn btn-primary" type="submit">Login</button>
                <div id="message" class="message"></div>
            </div>
        </div>
    </form>
    <a href="/forgot" onclick="navigate(event, 'forgot')" class="btn btn-link">Forgot password?</a>
</div>
