<div class="auth-form">
    <h2 class="auth-title" data-i18n="forgot.title">Find your account</h2>
    <p class="auth-subtitle" data-i18n="forgot.subtitle">Enter your email and we'll send you a reset link.</p>
    <form id="forgot">
        <div class="form-group">
            <input class="form-input" type="email" id="email" placeholder="Email" required data-i18n-ph="forgot.email">
        </div>
        <button class="btn btn-primary btn-block" type="submit" data-i18n="forgot.submit">Continue</button>
        <div id="message" class="message mt-2"></div>
    </form>
</div>
